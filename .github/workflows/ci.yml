name: AutoHeal-J CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # =======================================================
  # 1. BUILD & TEST JAVA SPRING BOOT MICROSERVICES
  # =======================================================
  build-java-services:
    name: Build Java Services (Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build All Microservices with Maven
        run: mvn clean package -DskipTests=false

  # =======================================================
  # 2. TEST & LINT PYTHON AI & HEALING ENGINES
  # =======================================================
  test-python-engines:
    name: Test Python Engines
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Anomaly Engine Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r anomaly-detection-engine/requirements.txt
          python -m py_compile anomaly-detection-engine/main.py

      - name: Install Healing Engine Dependencies
        run: |
          pip install -r healing-engine/requirements.txt
          python -m py_compile healing-engine/main.py

  # =======================================================
  # 3. VALIDATE KUBERNETES MANIFESTS
  # =======================================================
  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate K8s YAML Syntax
        run: |
          for f in k8s/*.yaml; do
            echo "Checking $f..."
            kubectl apply --dry-run=client -f "$f"
          done
