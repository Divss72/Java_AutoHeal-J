server.port=8080
spring.application.name=autoheal-dashboard-service

openai.api.key=YOUR_OPENAI_API_KEY

# Mocking prometheus URL for fallback if K8s isn't there
prometheus.url=http://localhost:9090

# Security: Shared HMAC secret for webhook authentication
autoheal.security.webhook-secret=${AUTOHEAL_WEBHOOK_SECRET:autoheal-webhook-hmac-secret-token}
