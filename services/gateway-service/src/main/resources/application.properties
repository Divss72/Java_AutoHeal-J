server.port=8080
spring.application.name=gateway-service
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always

# Standard Reactive Gateway configuration
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=${USER_SERVICE_URL:http://user-service:8081}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.routes[1].id=order-service
spring.cloud.gateway.routes[1].uri=${ORDER_SERVICE_URL:http://order-service:8082}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.routes[2].id=payment-service
spring.cloud.gateway.routes[2].uri=${PAYMENT_SERVICE_URL:http://payment-service:8083}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/payments/**

# Spring Cloud Gateway Server MVC configuration
spring.cloud.gateway.mvc.routes[0].id=user-service
spring.cloud.gateway.mvc.routes[0].uri=${USER_SERVICE_URL:http://user-service:8081}
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.mvc.routes[1].id=order-service
spring.cloud.gateway.mvc.routes[1].uri=${ORDER_SERVICE_URL:http://order-service:8082}
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.mvc.routes[2].id=payment-service
spring.cloud.gateway.mvc.routes[2].uri=${PAYMENT_SERVICE_URL:http://payment-service:8083}
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/payments/**

# Phase 2: Chaos & Simulation Endpoint Security
autoheal.security.admin-token=${AUTOHEAL_ADMIN_TOKEN:autoheal-secure-admin-token}

# Phase 4: Token-Bucket Rate Limiter Configuration
autoheal.ratelimit.enabled=${AUTOHEAL_RATELIMIT_ENABLED:true}
autoheal.ratelimit.capacity=${AUTOHEAL_RATELIMIT_CAPACITY:20}
autoheal.ratelimit.refill-rate=${AUTOHEAL_RATELIMIT_REFILL_RATE:10}

# Phase 4: Bulkhead Isolation Configuration
autoheal.bulkhead.enabled=${AUTOHEAL_BULKHEAD_ENABLED:true}
autoheal.bulkhead.max-concurrent-calls=${AUTOHEAL_BULKHEAD_MAX_CONCURRENT:10}
autoheal.bulkhead.max-wait-duration-ms=${AUTOHEAL_BULKHEAD_MAX_WAIT_MS:200}
