apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoheal-dashboard-service
  namespace: default
  labels:
    app: autoheal-dashboard-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autoheal-dashboard-service
  template:
    metadata:
      labels:
        app: autoheal-dashboard-service
    spec:
      containers:
        - name: autoheal-dashboard-service
          image: autoheal-dashboard-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: OPENAI_API_KEY
              value: "YOUR_OPENAI_API_KEY"
            - name: PROMETHEUS_URL
              value: "http://prometheus:9090"
---
apiVersion: v1
kind: Service
metadata:
  name: autoheal-dashboard-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: autoheal-dashboard-service
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
